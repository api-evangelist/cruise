name: Cruise
description: 'Cruise was an autonomous-vehicle (robotaxi) company founded in 2013 and
  majority-owned by General Motors, building self-driving technology and operating driverless
  ride-hail services in San Francisco and other U.S. cities. Backed by GM, Honda, SoftBank
  Vision Fund, Spark Capital, Y Combinator and others, Cruise suspended operations after
  a 2023 incident and, in December 2024, GM announced it would end robotaxi development
  and fold the Cruise team into GM''s own autonomous and driver-assistance programs. As
  of 2026 the getcruise.com domain 301-redirects to GM''s autonomous-driving pages. Cruise
  never published a public developer API, SDK, or documentation surface.'
